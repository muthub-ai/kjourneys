name: kjourneys-ci
# Safety net only: validates data on every push. The site is built locally with scripts/refresh.sh.
on:
  push:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Assemble split files
        run: python3 tools/assemble.py
      - name: Validate (schema, integrity, typing, temporal, publish gates, report integrity)
        run: python3 tools/validate_journey.py dist/kjourneys.json schema/journey-ontology.schema.json
      - name: Negative tests (every fixture must fail)
        run: bash tests/run_tests.sh
      - name: Ingest flow test
        run: python3 tests/test_ingest.py
