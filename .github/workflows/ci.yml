name: kjourneys-ci
# Safety net only: validates data on every push. The site is built locally with scripts/refresh.sh.
on:
  push:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Assemble split files
        run: python3 tools/assemble.py
      - name: Validate (schema, integrity, typing, temporal, publish gates, report integrity)
        run: python3 tools/validate_journey.py dist/kjourneys.json schema/journey-ontology.schema.json
      - name: Data matches its workbooks (no hand edits to imported MI data)
        run: |
          # only the current report: a report another manifest supersedes is kept, pinned, but no longer imported
          for d in $(python3 -c "
          import glob, json, os
          ms = {os.path.dirname(m): json.load(open(m)) for m in glob.glob('reports/*/manifest.json')}
          gone = {m.get('supersedes') for m in ms.values()}
          print(' '.join(d for d, m in sorted(ms.items()) if m.get('workbook') and m.get('report_version') not in gone))"); do
            python3 -I tools/import_mi_workbook.py "$d" --check
          done
      - name: Wells Fargo export and bundles are current and valid
        run: |
          python3 tools/export_focus.py --check
          python3 tools/build_bundles.py --check
          python3 tools/validate_bundles.py
      - name: Negative tests (every fixture must fail, for its own reason)
        run: bash tests/run_tests.sh
      - name: Ingest flow test
        run: python3 tests/test_ingest.py
